name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: personalsaving
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: personalsaving
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personalsaving -d personalsaving"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: personalsaving
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: personalsaving
      ENVIRONMENT_NAME: development
      LOG_LEVEL: INFO
      EXTERNAL_BASE_URL: "http://127.0.0.1:4455"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set-up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Check lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check types
        run: uv run --locked mypy
      - name: Run tests
        run: uv run --locked pytest
      - name: Check OpenAPI contract
        run: |
          uv run --locked python scripts/export_openapi.py
          git diff --exit-code -- openapi.json
